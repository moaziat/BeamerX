name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            linux: true
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            linux: true
          # macOS 14 hosted runners were retired in November 2026.
          - runner: macos-15
            target: aarch64-apple-darwin
            linux: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux build libraries
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev libx11-dev libxi-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build shipping binary
        env:
          # Keep the published Apple Silicon binary compatible with the
          # oldest macOS release advertised in the README.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --locked --profile dist --target "${{ matrix.target }}"
      - name: Package release archive
        run: scripts/package-release.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: beamerx-${{ matrix.target }}
          path: dist/beamerx-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum beamerx-*.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "BeamerX $GITHUB_REF_NAME"
